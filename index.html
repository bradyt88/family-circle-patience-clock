<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Circle — Patience Clock</title><link rel="stylesheet" href="styles.css"></head>
<body><header><button id="new">↻</button><div class="brand"><img src="assets/family-circle-logo.svg" alt="Family Circle"><b>Patience Clock</b></div><div class="stats"><span><b id="moves">0</b><small>moves</small></span><span><b id="seen">0</b><small>cards</small></span><span><b id="time">00:00</b><small>time</small></span></div></header>
<main><div class="head"><div><h1>Patience Clock</h1><p id="status">Preparing a fresh deck…</p></div><div><button id="pause">Pause</button></div></div>
<div class="felt"><div class="ring"></div><div id="board"></div><div class="centre"><section><label>KINGS</label><div id="kings" class="pile"></div><small id="kc">0 / 4</small></section><section><label>DRAW</label><div id="draw" class="pile"></div><small id="dc">4 cards</small></section></div><div id="indicator">Shuffling…</div></div>
<div class="info"><div>🕐 <b>Follow the rank</b><small>A=1 · J=11 · Q=12 · K=centre</small></div><div>👑 <b>Four Kings</b><small>The fourth King stops the game.</small></div><div>🎴 <b>Random deck</b><small>A new shuffle every game.</small></div></div></main>
<div id="modal" class="modal off"><div class="result"><img src="assets/family-circle-logo.svg" alt=""><label id="rk">GAME COMPLETE</label><h2 id="rt">Clock Completed</h2><p id="rx"></p><div class="final"><span><b id="fm">0</b><small>moves</small></span><span><b id="ft">00:00</b><small>time</small></span><span><b id="fs">0</b><small>cards</small></span></div><button id="again">Play Again</button></div></div>
<script src="game.js"></script></body></html>
